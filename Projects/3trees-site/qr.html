<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>3 Trees · Scan me</title>
<style>html,body{margin:0;background:#E9E3D9;font-family:Figtree,system-ui,sans-serif;color:#2E2418}a{color:#6E4F2C}a:hover{color:#2F6B1F}@media print{.noprint{display:none!important}html,body{background:#FFFFFF}}</style>
</head>
<body>
<main style="min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:24px;padding:40px 20px;box-sizing:border-box">
  <div style="width:100%;max-width:520px;background:#F7F4EE;border-radius:6px;box-shadow:0 18px 50px rgba(60,40,20,.18);padding:44px 40px 40px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center">
    <img src="assets/logo.png" alt="3 Trees" style="width:170px;height:auto;mix-blend-mode:multiply">
    <h1 style="margin:0;font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:34px;line-height:1.15;color:#6E4F2C">Scan to meet Yasmine</h1>
    <div style="padding:18px;background:#FFFFFF;border-radius:20px;border:2px solid #6E4F2C">
      <img id="qr" alt="QR code" style="display:block;width:260px;height:260px">
    </div>
    <p style="margin:0;font-size:15px;line-height:1.5;color:#5E5244;max-width:340px">Point your phone camera at the code to chat, talk or call us.</p>
    <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:#245818;font-weight:600;letter-spacing:.04em;text-transform:uppercase">
      <span style="width:8px;height:8px;border-radius:50%;background:#2F6B1F"></span>3 Trees Café · Lusaka<span style="width:8px;height:8px;border-radius:50%;background:#2F6B1F"></span>
    </div>
  </div>
  <div class="noprint" style="width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:#5E5244;text-align:center">
    <div>Links to: <a id="link" target="_blank" rel="noopener" style="font-family:ui-monospace,Menlo,monospace;word-break:break-all"></a></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button id="dl" style="padding:10px 16px;border-radius:8px;border:none;background:#6E4F2C;color:#FFFFFF;font:600 14px Figtree,sans-serif;cursor:pointer">Download QR (PNG)</button>
      <button onclick="window.print()" style="padding:10px 16px;border-radius:8px;border:1px solid #D9D0C2;background:#FFFFFF;color:#2E2418;font:600 14px Figtree,sans-serif;cursor:pointer">Print poster</button>
    </div>
  </div>
</main>
<script>
  var url = location.origin + location.pathname.replace(/[^/]*$/, '');
  var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&margin=20&format=png&color=6E4F2C&bgcolor=FFFFFF&data=' + encodeURIComponent(url);
  document.getElementById('qr').src = qrUrl;
  var a = document.getElementById('link'); a.href = url; a.textContent = url;
  document.getElementById('dl').onclick = function () {
    fetch(qrUrl).then(function (r) { return r.blob(); }).then(function (b) {
      var l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = '3trees-qr.png'; l.click();
    }).catch(function () { window.open(qrUrl, '_blank'); });
  };
</script>
</body>
</html>
